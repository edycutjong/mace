# Semantic version, derived from commits, recorded as a tag and a GitHub Release.
#
# TAGS ARE THE SOURCE OF TRUTH. This workflow never commits back to main: the history
# of this repository is part of what is being judged, and a "chore(release):" bot commit
# after every push would double the commit count with noise. package.json carries 1.0.0
# as a floor; `git describe --tags` is the authority.
#
# BUMP RULES — this repository does not write Conventional Commits (messages here read
# "pages: …", "interaction QA: …"), so a strict conventional parser would find nothing to
# bump and sit at 1.0.0 forever. The rules are therefore:
#
#   BREAKING CHANGE in the body, or a `!` before the colon  -> major
#   feat: / feat(scope):                                    -> minor
#   anything else                                           -> patch   (the default)
#
# So every push moves the version, and conventional prefixes escalate it when used.
#
# Nothing is tagged unless the suite passes first — a version should never point at a
# commit whose tests are red.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # full history + tags, or `git describe` sees nothing

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Never tag a red commit.
      - run: npm ci
      - run: npx vitest run

      - name: Work out the next version
        id: v
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$last" ]; then
            next="1.0.0"; bump="seed"; range=""
            echo "no tags yet — seeding at $next"
          else
            range="${last}..HEAD"
            if [ -z "$(git log --oneline "$range")" ]; then
              echo "no commits since $last — nothing to release"
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi

            subjects=$(git log --format='%s' "$range")
            bodies=$(git log --format='%B' "$range")

            if grep -qE '^BREAKING CHANGE:' <<<"$bodies" \
               || grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' <<<"$subjects"; then
              bump=major
            elif grep -qE '^feat(\([^)]*\))?:' <<<"$subjects"; then
              bump=minor
            else
              bump=patch
            fi

            IFS=. read -r MA MI PA <<<"${last#v}"
            case "$bump" in
              major) MA=$((MA+1)); MI=0; PA=0 ;;
              minor) MI=$((MI+1)); PA=0 ;;
              patch) PA=$((PA+1)) ;;
            esac
            next="${MA}.${MI}.${PA}"
          fi

          echo "skip=false"          >> "$GITHUB_OUTPUT"
          echo "next=$next"          >> "$GITHUB_OUTPUT"
          echo "tag=v$next"          >> "$GITHUB_OUTPUT"
          echo "bump=$bump"          >> "$GITHUB_OUTPUT"
          echo "prev=${last:-none}"  >> "$GITHUB_OUTPUT"
          echo "## \`v$next\` — $bump (was ${last:-none})" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag and release
        if: steps.v.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          PREV: ${{ steps.v.outputs.prev }}
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists — nothing to do"; exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

          if [ "$PREV" = "none" ]; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --notes-start-tag "$PREV"
          fi
