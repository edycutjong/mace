# Publishes site/ — the landing page and the pitch deck — to https://mace.edycu.dev
#
# It publishes site/, NOT the repository root, and that distinction is load-bearing.
# The root is the product, and the WebMCP origin-trial token is bound to
# https://pointoforder.netlify.app:443. Serving the app from any other host makes
# document.modelContext resolve to nothing, so the bench would render its degraded
# "WebMCP not detected" state on this domain. The live bench therefore stays on Netlify;
# this domain carries the pitch and links to it.
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  # Redeploy when a version ships, so the version chip on the landing page is never
  # stale. The chip is baked in at deploy time (see the substitution step) rather than
  # fetched at runtime — the page makes zero network requests, and an anonymous
  # api.github.com call would rate-limit to nothing exactly when a judge opens it.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deploys race; let an in-flight one finish rather than cancelling
# it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # tags, or `git describe` below finds nothing to stamp

      # Fail loudly rather than shipping a half-broken domain. The CNAME is what binds
      # the custom domain, and an index that lost its assets is worse than no deploy.
      - name: Check the artifact is intact
        run: |
          test -f site/index.html    || { echo "site/index.html missing"; exit 1; }
          test -f site/deck.html     || { echo "site/deck.html missing"; exit 1; }
          test -f site/judge.html    || { echo "site/judge.html missing"; exit 1; }
          test -f site/404.html      || { echo "site/404.html missing"; exit 1; }
          test -f site/CNAME         || { echo "site/CNAME missing — the custom domain would drop"; exit 1; }
          grep -qx 'mace.edycu.dev' site/CNAME || { echo "CNAME is not mace.edycu.dev"; exit 1; }
          test -d site/assets        || { echo "site/assets missing"; exit 1; }
          echo "ok — $(find site -type f | wc -l | tr -d ' ') files"

      - name: Bake the current version into the page
        run: |
          set -euo pipefail
          V=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$V" ]; then
            echo "no tags yet — dropping the version chip rather than shipping a placeholder"
            # Remove the whole anchor so a judge never sees the literal __VERSION__.
            perl -0pi -e 's{<a class="tag tag--ver"[^>]*>__VERSION__</a>\s*}{}g' site/index.html
          else
            echo "stamping $V"
            perl -0pi -e "s/__VERSION__/$V/g" site/index.html
          fi
          if grep -q '__VERSION__' site/index.html; then
            echo "a __VERSION__ placeholder survived — refusing to publish it"; exit 1
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
