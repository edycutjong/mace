name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The whole build step is `npm ci`, because there is no build step. Everything in
  # the tree is a devDependency — the app itself has zero — so this job is the suite
  # and nothing else.
  test:
    name: suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: install
        run: npm ci

      - name: vitest
        run: npx vitest run

      # Runs the same 306+ tests again under the v8 coverage provider and
      # enforces the per-file 100% thresholds set in vitest.config.js for the
      # seven pure-logic modules (rule/fsm/effects/path/minutes/ronr.data/seed).
      # ui.js, webmcp.js and declarative.js are deliberately excluded there —
      # see the comment in vitest.config.js — and stay covered by e2e/ instead.
      - name: coverage
        run: npm run coverage

      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # No bundler means nothing between src/*.js and the browser, so nothing catches a
  # typo'd identifier before a judge does. eslint.config.js is that step: no-undef
  # first, correctness rules after, and no formatter.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: install
        run: npm ci

      - name: eslint
        run: npm run lint

  # Drives the real index.html in Chromium off a static file server — the same thing
  # Netlify does, minus the origin-trial header. On a runner the trial is inactive
  # (the token is bound to pointoforder.netlify.app) and the bench renders from its
  # own state machine; the panel counts these tests assert are identical either way.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: install
        run: npm ci

      - name: install chromium
        run: npx playwright install --with-deps chromium

      - name: playwright
        run: npm run e2e

      - name: report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The origin-trial token in origin-trial.json is public on purpose and is allowlisted
  # in .gitleaks.toml; anything else that looks like a credential should fail the push.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the point is to scan the history, not just the tip

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
